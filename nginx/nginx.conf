events {
    worker_connections 1024;
}

http {
    # WebSocket Sticky Session Upstream (IP Hash)
    upstream backend_nodes {
        ip_hash; # Đảm bảo Client luôn kết nối lại đúng Server instance cũ
        server app-node-1:8080 max_fails=3 fail_timeout=30s;
        server app-node-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # REST API routing
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend routing
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket & STOMP routing
        location /ws {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            
            # Cấu hình Nâng cấp HTTP Header sang WebSocket Connection
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Tăng timeout giữ kết nối idle không bị ngắt tự động (24h)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}